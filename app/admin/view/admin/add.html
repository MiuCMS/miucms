{extend name="common/base"/}
<!-- 主体 -->
{block name="body"}
<style>
	body{background: #fff;}
	.layui-card{padding-bottom: 50px;}
	.layui-form-item{margin-bottom: 20px;}
</style>
<div class="layui-card">
	<form class="layui-form conf-layout p-page" lay-filter="webform">
	{if condition="$id eq 0"}
	<h3 class="pb-3">新增管理员</h3>

	<div class="layui-form-item">
		<label class="layui-form-label">登录账号<font>*</font></label>
		<div class="layui-input-block">
			<input type="text" name="username" lay-verify="required" placeholder="请输入登录账号" lay-reqText="请输入登录账号" autocomplete="off" class="layui-input">
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">用户名<font>*</font></label>
		<div class="layui-input-block">
			<input type="text" name="nickname" lay-verify="required" placeholder="请输入用户名" lay-reqText="请输入用户名" autocomplete="off" class="layui-input">
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">头像</label>
		<div class="layui-input-block">
			<div class="layui-inline marginr-0">
				<span style="display:inline-flex;align-items:center;">
					<i class="layui-icon layui-icon-picture" style="margin-right:5px;cursor:pointer;" id="thumb-preview-icon"></i>
					<input type="text" id="thumb" name="thumb" lay-affix="clear" autocomplete="off" class="layui-input" style="width:370px;" placeholder="点击上传或输入图片地址" value="">
				</span>
			</div>
			<div class="layui-inline">
				<button type="button" class="layui-btn layui-btn-sm layui-btn-primary layui-border-blue uploadBtn" data-bind="thumb">选择上传</button>
			</div>
			<p class="layui-word-aux"></p>
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">登录密码<font>*</font></label>
		<div class="layui-input-block">
			<input type="password" name="pwd" lay-verify="required" placeholder="请输入密码" lay-reqText="请输入密码" autocomplete="off" class="layui-input">
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">确认密码<font>*</font></label>
		<div class="layui-input-block">
			<input type="password" name="pwd_confirm" lay-verify="required" placeholder="请再次输入密码" lay-reqText="请再次输入密码" autocomplete="off" class="layui-input">
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">手机号码<font>*</font></label>
		<div class="layui-input-block">
			<input type="text" name="mobile" lay-verify="required" placeholder="请输入手机" lay-reqText="请输入手机" autocomplete="off" class="layui-input">
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">电子邮箱</label>
		<div class="layui-input-block">
			<input type="text" name="email" placeholder="电子邮箱" autocomplete="off" class="layui-input">
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">用户状态<font>*</font></label>
		<div class="layui-input-block">
			<input type="radio" name="status" value="1" title="正常" checked>
			<input type="radio" name="status" value="0" title="禁用">
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">用户角色<font>*</font></label>
		<div class="layui-input-block">
			{volist name=":get_admin_group()" id="v"}
			<input type="checkbox" name="group_id[]" title="{$v.title}" value="{$v.id}" lay-skin="primary">
			{/volist}
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">备注信息</label>
		<div class="layui-input-block">
			<textarea name="desc" placeholder="请输入备注" class="layui-textarea"></textarea>
		</div>
	</div>
	{else/}
	<h3 class="pb-3">编辑管理员</h3>

	<div class="layui-form-item">
		<label class="layui-form-label">登录账号<font>*</font></label>
		<div class="layui-input-block">
			<input type="hidden" name="id" value="{$admin.id}">
			<input type="text" name="username" lay-verify="required" placeholder="请输入登录账号" lay-reqText="请输入登录账号" autocomplete="off" class="layui-input" value="{$admin.username}">
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">用户名<font>*</font></label>
		<div class="layui-input-block">
			<input type="text" name="nickname" lay-verify="required" placeholder="请输入用户名" lay-reqText="请输入用户名" autocomplete="off" class="layui-input" value="{$admin.nickname}">
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">头像</label>
		<div class="layui-input-block">
			<div class="layui-inline marginr-0">
				<span style="display:inline-flex;align-items:center;">
					<i class="layui-icon layui-icon-picture" style="margin-right:5px;cursor:pointer;" id="thumb-preview-icon"></i>
					<input type="text" id="thumb" name="thumb" lay-affix="clear" autocomplete="off" class="layui-input" style="width:370px;" placeholder="点击上传或输入图片地址" value="{$admin.thumb}">
				</span>
			</div>
			<div class="layui-inline">
				<button type="button" class="layui-btn layui-btn-sm layui-btn-primary layui-border-blue uploadBtn" data-bind="thumb">选择上传</button>
			</div>
			<p class="layui-word-aux"></p>
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">登录密码</label>
		<div class="layui-input-block">
			<input type="password" name="edit_pwd" placeholder="请输入密码" autocomplete="off" class="layui-input">
			<p class="layui-word-aux">不修改密码请留空</p>
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">确认密码</label>
		<div class="layui-input-block">
			<input type="password" name="edit_pwd_confirm" placeholder="请再次输入密码" autocomplete="off" class="layui-input">
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">手机号码<font>*</font></label>
		<div class="layui-input-block">
			<input type="text" name="mobile" lay-verify="required" placeholder="请输入手机" lay-reqText="请输入手机" autocomplete="off" class="layui-input" value="{$admin.mobile==0?'':$admin.mobile}">
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">电子邮箱</label>
		<div class="layui-input-block">
			<input type="text" name="email" placeholder="电子邮箱" autocomplete="off" class="layui-input" value="{$admin.email}">
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">用户状态<font>*</font></label>
		<div class="layui-input-block">
			<input type="radio" name="status" value="1" title="正常" {eq name="$admin.status" value="1" }checked{/eq}>
			<input type="radio" name="status" value="0" title="禁用" {eq name="$admin.status" value="0"}checked{/eq}>
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">用户角色<font>*</font></label>
		<div class="layui-input-block">
			{volist name=":get_admin_group()" id="v"}
			<input type="checkbox" name="group_id[]" title="{$v.title}" value="{$v.id}" {volist name="$admin.group_id" id="a" }{eq name="$a" value="$v.id" }checked{/eq}{/volist} lay-skin="primary">
			{/volist}
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">备注信息</label>
		<div class="layui-input-block">
			<textarea name="desc" placeholder="请输入备注" class="layui-textarea">{$admin.desc|default=""}</textarea>
		</div>
	</div>
	{/if}

	<div class="layui-form-item">
		<div class="layui-input-block">
			<button class="layui-btn layui-btn-normal" lay-submit="" lay-filter="webform">立即提交</button>
			<button type="reset" class="layui-btn layui-btn-primary">重置</button>
		</div>
	</div>
	</form>
</div>
{/block}
<!-- /主体 -->

<!-- 脚本 -->
{block name="script"}
<script>
	layui.use(['tool'],function(){
		var form = layui.form,tool=layui.tool;
		//头像：打开文件管理器选择（和基本资料页一样）
		$('.uploadBtn').on('click', function(){
			openFileManager($(this).attr('data-bind'));
			return false;
		});
		//头像预览
		initThumbPreview('thumb', 'thumb-preview-icon');

		//监听提交
		form.on('submit(webform)', function (data) {
			let callback = function (e) {
				layer.msg(e.msg);
				if (e.code == 0) {
					parent.layui.tool.close(1000);
				}
			}
			tool.post("{:url('admin/admin/add')}", data.field, callback);
			return false;
		});
	})

</script>
{/block}
<!-- /脚本 -->
