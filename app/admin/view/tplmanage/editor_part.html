<!-- 弹窗编辑器模板 -->
<div id="editorPopup" style="display:none;">
    <div class="editor-container" id="editorContainer">
        <!-- 顶部工具栏（通屏） -->
        <div class="editor-toolbar">
            <button type="button" class="toolbar-btn primary" onclick="EditorApp.save()" title="Ctrl+S">
                <i class="fa fa-save"></i> 保存
            </button>
            <button type="button" class="toolbar-btn" onclick="EditorApp.saveAll()" title="保存所有">
                <i class="fa fa-floppy-o"></i> 全部保存
            </button>
            <button type="button" class="toolbar-btn" onclick="EditorApp.reloadFile()" title="重新加载当前文件">
                <i class="fa fa-refresh"></i> 重载
            </button>
            <button type="button" class="toolbar-btn" onclick="EditorApp.find()" title="Ctrl+F">
                <i class="fa fa-search"></i> 搜索
            </button>
            <button type="button" class="toolbar-btn" onclick="EditorApp.replace()" title="Ctrl+H">
                <i class="fa fa-exchange"></i> 替换
            </button>
            <button type="button" class="toolbar-btn" onclick="EditorApp.gotoLine()" title="Ctrl+G">
                <i class="fa fa-arrow-right"></i> 跳转行
            </button>
            <span class="toolbar-sep"></span>
            <button type="button" class="toolbar-btn" onclick="EditorApp.changeFontSize(-1)">A-</button>
            <button type="button" class="toolbar-btn" onclick="EditorApp.changeFontSize(1)">A+</button>
            <span class="toolbar-sep"></span>
            <button type="button" class="toolbar-btn" onclick="EditorApp.toggleTheme()" id="themeBtn">
                <i class="fa fa-adjust"></i> 主题
            </button>
            <button type="button" class="toolbar-btn" onclick="EditorApp.showShortcuts()">
                <i class="fa fa-keyboard-o"></i> 快捷键
            </button>
        </div>

        <!-- 路径和标签页区域（同一行） -->
        <div class="editor-header-bar">
            <div class="editor-file-info">
                <span class="file-info-item">
                    <i class="fa fa-folder-o"></i>
                    <span id="currentPath"></span>
                </span>
            </div>
            <div class="editor-tabs" id="editorTabs"></div>
        </div>

        <!-- 主体区域 -->
        <div class="editor-body">
            <!-- 左侧文件树 -->
            <div class="editor-sidebar" id="editorSidebar">
                <div class="sidebar-tools">
                    <button type="button" class="sidebar-btn" onclick="EditorApp.goUp()" title="上一级">
                        <i class="fa fa-level-up"></i> 上一级
                    </button>
                    <button type="button" class="sidebar-btn" onclick="EditorApp.refreshTree()" title="刷新">
                        <i class="fa fa-refresh"></i> 刷新
                    </button>
                </div>
                <div class="file-tree" id="fileTree"></div>
            </div>

            <!-- 侧边栏折叠按钮 -->
            <div class="sidebar-toggle" id="sidebarToggle" onclick="EditorApp.toggleSidebar()">
                <i class="fa fa-chevron-left"></i>
            </div>

            <!-- 右侧编辑区 -->
            <div class="editor-main">
                <!-- 编辑器 -->
                <div class="editor-content">
                    <textarea id="codeEditor"></textarea>
                </div>
            </div>
        </div>

        <!-- 状态栏（通屏） -->
        <div class="editor-statusbar">
            <span class="status-item" id="filePath">文件位置: </span>
            <span class="status-item" id="lineEnding">CRLF</span>
            <span class="status-item" id="cursorPos">行 1, 列 0</span>
            <span class="status-item" id="tabSize">制表符: 4</span>
            <span class="status-item" id="encoding">编码: UTF-8</span>
            <span class="status-item" id="fileType">语言: HTML</span>
            <span class="status-item" id="saveStatus">已保存</span>
        </div>
    </div>
</div>

<script>
layui.use(['layer'], function () {
var layer = layui.layer, $ = layui.jquery;
// 编辑器应用对象
var EditorApp = {
    editor: null,
    layerIndex: null,
    findLayerIndex: null,   // 查找/替换弹窗的 layer 索引
    isDark: true,
    fontSize: 14,
    currentFile: '',
    activepath: '',
    basePath: '{$activepath}',
    minPath: '{$minPath}',
    sidebarVisible: true,
    tabs: [],        // 存储所有打开的标签页 {filename, path, content, modified, mode, extension}
    activeTabIndex: -1,  // 当前激活的标签索引

    // 初始化编辑器
    init: function(layero) {
        var self = this;
        var textarea = layero.find('#codeEditor')[0];
        this.editor = CodeMirror.fromTextArea(textarea, {
            lineNumbers: true,
            fixedGutter: true,
            lineWrapping: true,
            mode: 'text/html',
            theme: 'monokai',
            styleActiveLine: true,
            matchBrackets: true,
            indentUnit: 4,
            tabSize: 4,
            indentWithTabs: false,
            extraKeys: {
                "Ctrl-S": function() { self.save(); },
                "Ctrl-F": function() { self.find(); },
                "Ctrl-H": function() { self.replace(); },
                "Ctrl-G": function() { self.gotoLine(); }
            }
        });

        this.editor.on('change', function() {
            self.setModified(true);
        });

        this.editor.on('cursorActivity', function() {
            var pos = self.editor.getCursor();
            self.layerDom.find('#cursorPos').text('行 ' + (pos.line + 1) + ', 列 ' + pos.ch);
        });

        // 事件委托：处理选项卡点击和关闭
        this.layerDom.on('click', '#editorTabs .editor-tab', function(e) {
            var $target = $(e.target);
            var $tab = $(this);
            var index = parseInt($tab.attr('data-index'));

            // 如果点击的是关闭按钮
            if ($target.hasClass('close-btn') || $target.closest('.close-btn').length > 0) {
                e.stopPropagation();
                self.closeTab(e, index);
            } else {
                // 点击选项卡本身，切换到该选项卡
                self.switchTab(index);
            }
        });
    },

    // 加载文件内容
    loadFile: function(filename, path) {
        var self = this;

        // 检查是否已经打开了这个文件
        var existingIndex = this.findTab(filename, path);
        if (existingIndex !== -1) {
            this.switchTab(existingIndex);
            return;
        }

        // 保存当前标签的内容
        this.saveCurrentTabContent();

        var loadingIdx = layer.load(1, {shade: [0.3, '#000']});
        $.ajax({
            url: '{:url("admin/tplmanage/api")}?do=get_content',
            type: 'GET',
            data: { filename: filename, activepath: path },
            dataType: 'json',
            success: function(res) {
                layer.close(loadingIdx);

                if (res.code == 1) {
                    // 添加新标签
                    var newTab = {
                        filename: filename,
                        path: path,
                        content: res.data.content || '',
                        modified: false,
                        mode: res.data.mode || 'text/html',
                        extension: res.data.extension || 'htm'
                    };
                    self.tabs.push(newTab);
                    self.activeTabIndex = self.tabs.length - 1;

                    self.currentFile = filename;
                    self.activepath = path;
                    self.editor.setValue(res.data.content || '');
                    self.editor.setOption('mode', res.data.mode || 'text/html');
                    self.editor.clearHistory();
                    self.editor.refresh();

                    // 在所有编辑器操作完成后再设置modified状态和渲染标签页
                    self.setModified(false);
                    self.renderTabs();

                    // 更新路径显示
                    self.layerDom.find('#currentPath').text(path || '/');

                    self.updateStatusBar(filename, path, res.data.extension);
                    self.highlightActiveFile();
                } else {
                    layer.msg(res.msg || '加载失败', {icon: 2});
                }
            },
            error: function() {
                layer.close(loadingIdx);
                layer.msg('加载失败', {icon: 2});
            }
        });
    },

    // 设置修改状态
    setModified: function(val) {
        if (this.activeTabIndex >= 0 && this.activeTabIndex < this.tabs.length) {
            this.tabs[this.activeTabIndex].modified = val;
        }
        var tab = this.layerDom.find('.editor-tab.active');
        var status = this.layerDom.find('#saveStatus');
        if (val) {
            tab.addClass('modified');
            status.text('未保存').css('color', '#e2c08d');
        } else {
            tab.removeClass('modified');
            status.text('已保存').css('color', '#67c23a');
        }
    },

    // 保存文件
    save: function() {
        var self = this;

        // 验证是否有打开的文件
        if (!this.currentFile || this.activeTabIndex < 0) {
            layer.msg('没有打开的文件', {icon: 0, time: 1000});
            return;
        }

        // 检查文件是否被修改
        var currentTab = this.tabs[this.activeTabIndex];
        if (!currentTab.modified) {
            layer.msg('文件未修改，无需保存', {icon: 0, time: 1000});
            return;
        }

        // 验证路径参数
        if (!this.activepath) {
            layer.msg('文件路径无效', {icon: 2, time: 1000});
            return;
        }

        var content = this.editor.getValue();
        // 更新当前标签的内容
        if (this.activeTabIndex >= 0) {
            this.tabs[this.activeTabIndex].content = content;
        }
        var loadingIdx = layer.load(1, {shade: [0.3, '#000']});
        $.ajax({
            url: '{:url("admin/tplmanage/api")}?do=save',
            type: 'POST',
            data: {
                filename: this.currentFile,
                activepath: this.activepath,
                content: content
            },
            dataType: 'json',
            success: function(res) {
                layer.close(loadingIdx);

                if (res.code == 1) {
                    self.setModified(false);
                    self.renderTabs();
                    layer.msg('保存成功', {icon: 1, time: 1000});
                } else {
                    layer.msg(res.msg || '保存失败', {icon: 2});
                }
            },
            error: function() {
                layer.close(loadingIdx);
                layer.msg('保存失败', {icon: 2});
            }
        });
    },

    // 保存所有文件
    saveAll: function() {
        var self = this;
        var unsavedTabs = this.tabs.filter(function(t) { return t.modified; });

        if (unsavedTabs.length === 0) {
            layer.msg('没有需要保存的文件', {icon: 0, time: 1000});
            return;
        }

        var savedCount = 0;
        var totalCount = unsavedTabs.length;
        var loadingIdx = layer.load(1, {shade: [0.3, '#000']});

        unsavedTabs.forEach(function(tab, index) {
            $.ajax({
                url: '{:url("admin/tplmanage/api")}?do=save',
                type: 'POST',
                data: {
                    filename: tab.filename,
                    activepath: tab.path,
                    content: tab.content
                },
                dataType: 'json',
                success: function(res) {
                    if (res.code == 1) {
                        tab.modified = false;
                        savedCount++;
                        if (savedCount === totalCount) {
                            layer.close(loadingIdx);
                            self.renderTabs();

                            // 如果当前激活的标签被保存了，更新状态显示
                            if (self.activeTabIndex >= 0 && !self.tabs[self.activeTabIndex].modified) {
                                var status = self.layerDom.find('#saveStatus');
                                status.text('已保存').css('color', '#67c23a');
                            }

                            layer.msg('已保存 ' + savedCount + ' 个文件', {icon: 1, time: 1500});
                        }
                    } else {
                        layer.close(loadingIdx);
                        layer.msg(res.msg || '保存失败', {icon: 2});
                    }
                },
                error: function() {
                    savedCount++;
                    if (savedCount === totalCount) {
                        layer.close(loadingIdx);
                    }
                    layer.msg('保存失败', {icon: 2});
                }
            });
        });
    },

    // 刷新编辑器
    refreshEditor: function() {
        if (this.editor) {
            this.editor.refresh();
            layer.msg('已刷新', {icon: 1, time: 1000});
        }
    },

    // 重新加载当前文件
    reloadFile: function() {
        var self = this;

        // 检查是否有打开的文件
        if (!this.currentFile || this.activeTabIndex < 0) {
            layer.msg('没有打开的文件', {icon: 0, time: 1000});
            return;
        }

        var currentTab = this.tabs[this.activeTabIndex];

        // 如果文件被修改了，提示用户
        if (currentTab.modified) {
            layer.confirm('当前文件有未保存的修改，重新加载将丢失这些修改，确定继续？', {
                shade: [0.3, '#000'],
                area: ['480px', '190px'],
                move: false,
                title: '提示',
                btnAlign:'r',
                closeBtn: 3,
                btn: ['确定', '取消']
            }, function(index){
                layer.close(index);
                self.doReloadFile();
            });
        } else {
            this.doReloadFile();
        }
    },

    // 执行重新加载
    doReloadFile: function() {
        var self = this;
        var loadingIdx = layer.load(1, {shade: [0.3, '#000']});

        $.ajax({
            url: '{:url("admin/tplmanage/api")}?do=get_content',
            type: 'GET',
            data: {
                filename: this.currentFile,
                activepath: this.activepath
            },
            dataType: 'json',
            success: function(res) {
                layer.close(loadingIdx);
                if (res.code == 1) {
                    // 更新当前标签的内容
                    var currentTab = self.tabs[self.activeTabIndex];
                    currentTab.content = res.data.content || '';
                    currentTab.modified = false;

                    // 更新编辑器
                    self.editor.setValue(res.data.content || '');
                    self.editor.clearHistory();
                    currentTab.history = null;
                    self.setModified(false);
                    self.renderTabs();

                    layer.msg('文件已重新加载', {icon: 1, time: 1000});
                } else {
                    layer.msg(res.msg || '加载失败', {icon: 2});
                }
            },
            error: function() {
                layer.close(loadingIdx);
                layer.msg('加载失败', {icon: 2});
            }
        });
    },

    // 更新路径显示
    updatePathBar: function() {
        var pathEl = this.layerDom.find('#currentPath');
        if (pathEl.length > 0) {
            pathEl.text(this.basePath || '/');
        }
    },

    // 渲染所有标签页
    renderTabs: function() {
        var self = this;
        var html = '';
        this.tabs.forEach(function(tab, index) {
            var isActive = index === self.activeTabIndex ? ' active' : '';
            var isModified = tab.modified ? ' modified' : '';
            html += '<div class="editor-tab' + isActive + isModified + '" data-index="' + index + '">';
            html += '<span class="tab-icon"><i class="fa fa-file-o"></i></span>';
            html += '<span class="filename">' + tab.filename + '</span>';
            html += '<span class="close-btn" data-action="close">×</span>';
            html += '</div>';
        });
        var tabsEl = this.layerDom.find('#editorTabs');
        if (tabsEl.length === 0) {
            console.error('editorTabs element not found');
        }
        tabsEl.html(html);
    },

    // 查找已打开的标签
    findTab: function(filename, path) {
        for (var i = 0; i < this.tabs.length; i++) {
            if (this.tabs[i].filename === filename && this.tabs[i].path === path) {
                return i;
            }
        }
        return -1;
    },

    // 保存当前标签内容到内存（包括撤销历史）
    saveCurrentTabContent: function() {
        if (this.activeTabIndex >= 0 && this.activeTabIndex < this.tabs.length && this.editor) {
            this.tabs[this.activeTabIndex].content = this.editor.getValue();
            this.tabs[this.activeTabIndex].history = this.editor.getHistory();
        }
    },

    // 切换标签页
    switchTab: function(index) {
        if (index === this.activeTabIndex) return;
        if (index < 0 || index >= this.tabs.length) return;

        // 保存当前标签内容
        this.saveCurrentTabContent();

        // 切换到新标签
        this.activeTabIndex = index;
        var tab = this.tabs[index];
        this.currentFile = tab.filename;
        this.activepath = tab.path;

        // 保存原始的 modified 状态
        var originalModified = tab.modified;

        // 更新编辑器（这些操作会触发 change 事件）
        this.editor.setValue(tab.content);
        this.editor.setOption('mode', tab.mode);

        // 恢复该标签页的独立撤销历史（修复跨文件撤销重做问题）
        if (tab.history) {
            this.editor.setHistory(tab.history);
        } else {
            this.editor.clearHistory();
        }

        // 恢复原始的 modified 状态
        tab.modified = originalModified;

        this.renderTabs();
        this.updateStatusBar(tab.filename, tab.path, tab.extension);
        this.highlightActiveFile();

        // 更新修改状态显示
        var status = this.layerDom.find('#saveStatus');
        if (tab.modified) {
            status.text('未保存').css('color', '#e2c08d');
        } else {
            status.text('已保存').css('color', '#67c23a');
        }
    },

    // 关闭标签页
    closeTab: function(e, index) {
        e.stopPropagation();
        var tab = this.tabs[index];

        if (tab.modified) {
            if (!confirm('文件 "' + tab.filename + '" 未保存，确定关闭？')) return;
        }

        this.tabs.splice(index, 1);

        if (this.tabs.length === 0) {
            // 没有标签了，关闭编辑器
            layer.close(this.layerIndex);
            return;
        }

        // 调整当前激活索引
        if (index < this.activeTabIndex) {
            this.activeTabIndex--;
        } else if (index === this.activeTabIndex) {
            // 关闭的是当前标签，切换到前一个或后一个
            if (this.activeTabIndex >= this.tabs.length) {
                this.activeTabIndex = this.tabs.length - 1;
            }
            var newTab = this.tabs[this.activeTabIndex];
            this.currentFile = newTab.filename;
            this.activepath = newTab.path;

            // 保存原始 modified 状态
            var originalModified = newTab.modified;

            // 这些操作会触发 change 事件
            this.editor.setValue(newTab.content);
            this.editor.setOption('mode', newTab.mode);

            // 恢复该标签页的独立撤销历史
            if (newTab.history) {
                this.editor.setHistory(newTab.history);
            } else {
                this.editor.clearHistory();
            }

            // 恢复原始 modified 状态
            newTab.modified = originalModified;

            this.updateStatusBar(newTab.filename, newTab.path, newTab.extension);
            this.highlightActiveFile();
        }

        this.renderTabs();
    },

    // 更新状态栏
    updateStatusBar: function(filename, path, ext) {
        this.layerDom.find('#filePath').text('文件位置: ' + path + '/' + filename);
        var langMap = {htm:'HTML', html:'HTML', css:'CSS', js:'JavaScript', php:'PHP', json:'JSON'};
        this.layerDom.find('#fileType').text('语言: ' + (langMap[ext] || ext.toUpperCase()));
    },

    // 加载文件树
    loadFileTree: function() {
        var self = this;
        $.ajax({
            url: '{:url("admin/tplmanage/api")}?do=file_tree',
            type: 'GET',
            data: { activepath: this.basePath },
            dataType: 'json',
            success: function(res) {
                if (res.code == 1) {
                    self.renderTree(res.data, self.layerDom.find('#fileTree')[0]);
                    self.updatePathBar();
                }
            }
        });
    },

    // 渲染文件树
    // parentPath: 当前目录的冒号格式路径，用于构建子目录路径
    renderTree: function(data, container, parentPath) {
        // 如果没有传 parentPath，使用 basePath（顶层调用时）
        var currentParent = parentPath || this.basePath;
        var html = '<ul>';
        var self = this;
        data.forEach(function(item) {
            if (item.type === 'dir') {
                // 根据父目录路径和 item.name 生成正确的子目录路径
                var itemPath;
                if (!currentParent || currentParent === '/' || currentParent === '') {
                    itemPath = ':' + item.name;
                } else {
                    // 统一用冒号格式拼接
                    var normalized = currentParent.replace(/\//g, ':');
                    itemPath = normalized + ':' + item.name;
                    // 确保开头只有一个冒号
                    itemPath = ':' + itemPath.replace(/^:+/, '');
                }

                html += '<li class="folder collapsed">';
                html += '<div class="tree-item" onclick="EditorApp.toggleFolder(this, \'' + itemPath + '\')">';
                html += '<i class="fa fa-caret-right folder-arrow"></i>';
                html += '<i class="fa fa-folder folder-icon"></i>';
                html += '<span>' + item.name + '</span></div>';
                html += '<ul class="children"></ul></li>';
            } else {
                var isActive = item.name === self.currentFile ? ' active' : '';
                html += '<li class="file">';
                html += '<div class="tree-item' + isActive + '" data-path="' + item.path + '" data-name="' + item.name + '" onclick="EditorApp.openFile(this)">';
                html += '<i class="fa fa-file-o"></i>';
                html += '<span>' + item.name + '</span></div></li>';
            }
        });
        html += '</ul>';
        container.innerHTML = html;
    },

    // 展开/折叠文件夹
    toggleFolder: function(el, path) {
        var li = el.parentNode;
        var children = li.querySelector('.children');
        var arrow = el.querySelector('.folder-arrow');

        if (li.classList.contains('collapsed')) {
            li.classList.remove('collapsed');
            li.classList.add('expanded');
            arrow.classList.remove('fa-caret-right');
            arrow.classList.add('fa-caret-down');
            if (children.children.length === 0) {
                this.loadSubTree(path, children);
            }
        } else {
            li.classList.remove('expanded');
            li.classList.add('collapsed');
            arrow.classList.remove('fa-caret-down');
            arrow.classList.add('fa-caret-right');
        }
    },

    // 加载子目录
    loadSubTree: function(path, container) {
        var self = this;
        $.ajax({
            url: '{:url("admin/tplmanage/api")}?do=file_tree',
            type: 'GET',
            data: { activepath: path },
            dataType: 'json',
            success: function(res) {
                if (res.code == 1) {
                    // 传递当前目录路径作为 parentPath，确保子目录路径正确拼接
                    self.renderTree(res.data, container, path);
                }
            }
        });
    },

    // 默认展开到指定目录（打开文件时用，免得还要手动一层层点开）
    expandToDir: function(dirPath) {
        var self = this;
        var norm = String(dirPath || '').replace(/[:\\]/g, '/').replace(/^\/+|\/+$/g, '');
        if (!norm) return;
        var segs = norm.split('/').filter(function (s) { return s !== ''; });
        if (!segs.length) return;

        var step = function (parent, idx, tries) {
            if (idx >= segs.length) return;
            var target = parent + ':' + segs[idx];   // :default / :default:static
            var li = self.findFolderLi(target);
            if (!li) {
                // 目录节点还没渲染出来（树是异步加载的），稍后重试
                if ((tries || 0) < 20) { setTimeout(function () { step(parent, idx, (tries || 0) + 1); }, 100); }
                return;
            }
            if (li.classList.contains('collapsed')) {
                self.toggleFolder(li.querySelector('.tree-item'), target);
            }
            var children = li.querySelector('.children');
            var wait = function (n) {
                if (children.children.length > 0) {
                    step(target, idx + 1, 0);          // 子节点到了，继续展开下一级
                } else if (n < 20) {
                    setTimeout(function () { wait(n + 1); }, 100);
                }
            };
            setTimeout(function () { wait(0); }, 100);
        };
        step('', 0, 0);
    },

    // 按冒号格式路径找目录节点（只在弹窗 DOM 里找，避免命中页面上隐藏的那份模板）
    findFolderLi: function(colonPath) {
        var found = null;
        this.layerDom.find('#fileTree .folder').each(function () {
            var oc = $(this).children('.tree-item').attr('onclick') || '';
            if (oc.indexOf("'" + colonPath + "'") >= 0) { found = this; return false; }
        });
        return found;
    },

    // 打开文件
    openFile: function(el) {
        var path = el.getAttribute('data-path');
        var name = el.getAttribute('data-name');

        // 检查是否已打开
        var existingIndex = this.findTab(name, path);
        if (existingIndex !== -1) {
            // 如果当前标签有未保存的修改，先保存内容
            this.saveCurrentTabContent();
            this.switchTab(existingIndex);
            return;
        }

        // 加载新文件
        this.loadFile(name, path);
    },

    // 高亮当前文件
    highlightActiveFile: function() {
        var self = this;
        this.layerDom.find('#fileTree .tree-item').each(function() {
            $(this).removeClass('active');
            if ($(this).attr('data-name') === self.currentFile) {

    // 切换侧边栏
    toggleSidebar: function() {
        var sidebar = this.layerDom.find('#editorSidebar');
        var toggle = this.layerDom.find('#sidebarToggle');
        var icon = toggle.find('i');
        this.sidebarVisible = !this.sidebarVisible;
        if (this.sidebarVisible) {
            sidebar.show();
            toggle.removeClass('collapsed');
            icon.removeClass('fa-chevron-right').addClass('fa-chevron-left');
        } else {
            sidebar.hide();
            toggle.addClass('collapsed');
            icon.removeClass('fa-chevron-left').addClass('fa-chevron-right');
        }
        this.editor && this.editor.refresh();
    },

    // 上一级目录
    goUp: function() {
        if (!this.basePath || this.basePath === '/' || this.basePath === '') {
            layer.msg('已经是最上级目录', {icon: 0, time: 1000});
            return;
        }

        // 统一用冒号格式比较
        var normalize = function(p) {
            return p.replace(/\//g, ':').replace(/^:+/, '').replace(/:+$/, '');
        };
        var currentNorm = normalize(this.basePath);
        var minNorm = normalize(this.minPath);

        // 已经到达或低于最小路径，禁止继续上翻
        if (currentNorm === minNorm || currentNorm.indexOf(':') === -1) {
            layer.msg('已经是最上级目录', {icon: 0, time: 1000});
            return;
        }

        // 去掉最后一段
        var parts = currentNorm.split(':');
        parts.pop();
        var newNorm = parts.join(':');

        // 确保不超出 minPath
        if (newNorm.length < minNorm.length && minNorm.indexOf(newNorm) !== 0) {
            layer.msg('已经是最上级目录', {icon: 0, time: 1000});
            return;
        }

        this.basePath = ':' + newNorm;
        this.loadFileTree();
        layer.msg('已返回上一级', {icon: 1, time: 1000});
    },

    // 刷新文件树
    refreshTree: function() {
        this.loadFileTree();
    },

    // 搜索（打开「查找 / 替换」弹窗，默认停在查找卡）
    find: function() {
        this.openFindReplace('find');
    },

    // 替换（打开「查找 / 替换」弹窗，默认停在替换卡）
    replace: function() {

    },

    // 查找 / 替换弹窗
    // mode: 'find' = 默认查找卡；'replace' = 默认替换卡
    openFindReplace: function(mode) {
        var self = this;
        var editor = this.editor;
        if (!editor) return;

        // 已经开着就关掉重开，避免叠多个弹窗
        if (this.findLayerIndex !== null) {
            layer.close(this.findLayerIndex);
            this.findLayerIndex = null;
        }

        var LS_FIND  = 'miu_tpl_search_hist';   // 查找关键词历史（localStorage）
        var LS_REPL  = 'miu_tpl_replace_hist';  // 替换内容历史
        var HIST_MAX = 20;

        function loadHist(key) {
            try {
                var arr = JSON.parse(localStorage.getItem(key) || '[]');
                return Array.isArray(arr) ? arr : [];
            } catch (e) { return []; }
        }
        function saveHist(key, arr) {
            try { localStorage.setItem(key, JSON.stringify(arr.slice(0, HIST_MAX))); } catch (e) {}
        }
        function pushHist(key, val) {
            val = $.trim(val || '');
            if (!val) return;
            var arr = loadHist(key).filter(function(x) { return x !== val; });
            arr.unshift(val);
            saveHist(key, arr);
        }
        function esc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        var html = ''
            + '<div class="miu-fr">'
            +   '<div class="miu-fr-tabs">'
            +     '<div class="miu-fr-tab" data-tab="find">查找</div>'
            +     '<div class="miu-fr-tab" data-tab="replace">替换</div>'
            +   '</div>'
            +   '<div class="miu-fr-body">'
            +     '<div class="miu-fr-left">'
            +       '<div class="miu-fr-field">'
            +         '<label>查找目标</label>'
            +         '<div class="miu-fr-inputwrap">'
            +           '<input type="text" id="frFind" autocomplete="off" spellcheck="false">'
            +           '<span class="miu-fr-arrow" data-for="find"><i class="fa fa-caret-down"></i></span>'
            +           '<div class="miu-fr-hist" data-for="find"></div>'
            +         '</div>'
            +       '</div>'
            +       '<div class="miu-fr-field fr-replace-row">'
            +         '<label>替换为</label>'
            +         '<div class="miu-fr-inputwrap">'
            +           '<input type="text" id="frReplace" autocomplete="off" spellcheck="false">'
            +           '<span class="miu-fr-arrow" data-for="replace"><i class="fa fa-caret-down"></i></span>'
            +           '<div class="miu-fr-hist" data-for="replace"></div>'
            +         '</div>'
            +       '</div>'
            +       '<div class="miu-fr-checks">'
            +         '<label><input type="checkbox" id="frCase">匹配大小写</label>'
            +         '<label><input type="checkbox" id="frWrap">循环查找</label>'
            +       '</div>'
            +     '</div>'
            +     '<div class="miu-fr-right">'
            +       '<button type="button" class="miu-fr-btn" data-act="next">查找下一个</button>'
            +       '<button type="button" class="miu-fr-btn" data-act="prev">查找上一个</button>'
            +       '<button type="button" class="miu-fr-btn" data-act="count">计数</button>'
            +       '<button type="button" class="miu-fr-btn" data-act="replace">替换</button>'
            +       '<button type="button" class="miu-fr-btn" data-act="replaceAll">全部替换</button>'
            +     '</div>'
            +   '</div>'
            +   '<div class="miu-fr-count" id="frCount"></div>'
            + '</div>';

        this.findLayerIndex = layer.open({
            type: 1,
            title: (mode === 'replace' ? '替换' : '查找'),
            skin: 'miu-fr-layer',
            area: ['560px', 'auto'],
            shade: false,
            resize: false,
            content:html,
            end: function() { self.findLayerIndex = null; },
            success: function(layero) {
                var $l       = layero;
                var $find    = $l.find('#frFind');
                var $repl    = $l.find('#frReplace');
                var $case    = $l.find('#frCase');
                var $wrap    = $l.find('#frWrap');
                var $count   = $l.find('#frCount');
                var $replRow = $l.find('.fr-replace-row');

                // 编辑器里选中了文字的话，默认填进「查找目标」
                var picked = $.trim(editor.getSelection());
                if (picked) { $find.val(picked); }

                function query() { return $.trim($find.val()); }
                function replacement() { return $repl.val(); }
                // 勾选「匹配大小写」= 区分大小写（caseFold=false）
                function opts() { return { caseFold: !$case.prop('checked') }; }

                function hideAllHist() { $l.find('.miu-fr-hist').removeClass('show'); }

                function setMode(m) {
                    $l.find('.miu-fr-tab').removeClass('active')
                        .filter('[data-tab="' + m + '"]').addClass('active');
                    var isRepl = (m === 'replace');
                    // 弹窗标题跟着当前标签卡走
                    var $frTitle = $l.find('.layui-layer-title');
                    if ($frTitle.length) { $frTitle.html(isRepl ? '替换' : '查找'); }
                    $replRow.toggle(isRepl);
                    $l.find('[data-act="count"]').toggle(!isRepl);
                    $l.find('[data-act="replace"],[data-act="replaceAll"]').toggle(isRepl);
                    $count.html('');
                    $find.focus();
                }

                function selectRange(from, to) {
                    editor.setSelection(from, to);
                    editor.scrollIntoView({ from: from, to: to }, 60);
                }

                // 统计关键词在全文中的匹配数量
                function countMatches(q) {
                    if (!q) return 0;
                    var cur = editor.getSearchCursor(q, { line: 0, ch: 0 }, opts());
                    var n = 0;
                    while (cur.findNext()) {
                        n++;
                        if (n > 500000) break;   // 保险丝，防异常死循环
                    }
                    return n;
                }

                function requireQuery() {
                    var q = query();
                    if (!q) { layer.msg('请输入查找目标', { icon: 0 }); $find.focus(); return ''; }
                    return q;
                }

                // 查找下一个 / 上一个
                function doFind(reverse) {
                    var q = requireQuery();
                    if (!q) return;
                    pushHist(LS_FIND, q);

                    var start = reverse ? editor.getCursor('from') : editor.getCursor('to');
                    var cur = editor.getSearchCursor(q, start, opts());
                    var found = reverse ? cur.findPrevious() : cur.findNext();

                    // 到边界后：勾了「循环查找」就从头/从尾绕回去
                    if (!found && $wrap.prop('checked')) {
                        var edge = reverse
                            ? { line: editor.lastLine(), ch: editor.getLine(editor.lastLine()).length }
                            : { line: 0, ch: 0 };
                        cur = editor.getSearchCursor(q, edge, opts());
                        found = reverse ? cur.findPrevious() : cur.findNext();
                    }

                    if (!found) {
                        if (countMatches(q) === 0) {
                            layer.msg('未找到匹配内容', { icon: 0 });
                        } else {
                            layer.msg('已到' + (reverse ? '开头' : '末尾') + '，可勾选「循环查找」', { icon: 0 });
                        }
                        return;
                    }
                    selectRange(cur.from(), cur.to());
                }

                // 计数
                function doCount() {
                    var q = requireQuery();
                    if (!q) return;
                    pushHist(LS_FIND, q);
                    $count.html('计数：<b>' + countMatches(q) + '</b>次匹配');
                }

                // 替换一个：替换当前匹配，并把光标移到下一个匹配处选中
                function doReplace() {
                    var q = requireQuery();
                    if (!q) return;
                    pushHist(LS_FIND, q);
                    pushHist(LS_REPL, replacement());

                    var sel  = editor.getSelection();
                    var same = sel !== '' && ($case.prop('checked') ? sel === q : sel.toLowerCase() === q.toLowerCase());
                    if (!same) { doFind(false); return; }   // 当前没选中匹配，就先找下一个

                    var cur = editor.getSearchCursor(q, editor.getCursor('from'), opts());
                    if (!cur.findNext()) { doFind(false); return; }
                    cur.replace(replacement());   // 替换后 cursor 停在替换文本末尾

                    var found = cur.findNext();
                    if (!found && $wrap.prop('checked')) {
                        var c2 = editor.getSearchCursor(q, { line: 0, ch: 0 }, opts());
                        found = c2.findNext();
                        if (found) cur = c2;
                    }
                    if (found) selectRange(cur.from(), cur.to());
                }

                // 全部替换
                function doReplaceAll() {
                    var q = requireQuery();
                    if (!q) return;
                    pushHist(LS_FIND, q);
                    pushHist(LS_REPL, replacement());

                    var rep = replacement();
                    var cur = editor.getSearchCursor(q, { line: 0, ch: 0 }, opts());
                    var n = 0;
                    editor.operation(function() {
                        while (cur.findNext()) {
                            cur.replace(rep);
                            n++;
                            if (n > 200000) break;
                        }
                    });
                    $count.html('计数：<b>' + countMatches(q) + '</b>次匹配');
                    layer.msg(n > 0 ? ('已替换 ' + n + ' 处') : '未找到匹配内容', { icon: n > 0 ? 1 : 0 });
                }

                // 历史记录下拉
                function renderHist($box) {
                    var key = ($box.data('for') === 'replace') ? LS_REPL : LS_FIND;
                    var arr = loadHist(key);
                    if (!arr.length) {
                        $box.html('<div class="miu-fr-hist-empty">暂无记录</div>');
                        return;
                    }
                    var h = '';
                    for (var i = 0; i < arr.length; i++) {
                        h += '<div class="miu-fr-hist-item">' + esc(arr[i]) + '</div>';
                    }
                    $box.html(h);
                }

                // ---- 事件绑定 ----
                $l.find('.miu-fr-tab').on('click', function() { setMode($(this).data('tab')); });

                $l.find('.miu-fr-arrow').on('click', function(e) {
                    e.stopPropagation();
                    var $box = $l.find('.miu-fr-hist[data-for="' + $(this).data('for') + '"]');
                    var isOpen = $box.hasClass('show');
                    hideAllHist();
                    if (!isOpen) { renderHist($box); $box.addClass('show'); }
                });

                $l.on('click', '.miu-fr-hist-item', function() {
                    var $box = $(this).closest('.miu-fr-hist');
                    var $input = ($box.data('for') === 'replace') ? $repl : $find;
                    $input.val($.trim($(this).text()));
                    hideAllHist();
                    $input.focus();
                });

                // 点弹窗空白处收起下拉（输入框和箭头各自拦一下冒泡）
                $l.on('click', function() { hideAllHist(); });
                $l.find('.miu-fr-inputwrap input').on('click', function(e) { e.stopPropagation(); });

                $l.find('.miu-fr-btn').on('click', function() {
                    var act = $(this).data('act');
                    if (act === 'next') doFind(false);
                    else if (act === 'prev') doFind(true);
                    else if (act === 'count') doCount();
                    else if (act === 'replace') doReplace();
                    else if (act === 'replaceAll') doReplaceAll();
                });

                // 输入框回车 = 查找下一个（Shift+回车 = 查找上一个）
                $find.on('keydown', function(e) {
                    if (e.keyCode === 13) { e.preventDefault(); doFind(e.shiftKey); }
                });
                $repl.on('keydown', function(e) {
                    if (e.keyCode === 13) { e.preventDefault(); doReplace(); }
                });

                setMode(mode === 'replace' ? 'replace' : 'find');
            }
        });
    },


    // 跳转行
    gotoLine: function() {
        var that=this;
        layer.prompt({title: '跳转到',placeholder:'输入要跳转到的行号'}, function(value, index, elem){
            var line=value;
            if(value === '') return elem.focus();
            if (line) {
                var lineNum = parseInt(line, 10) - 1;
                that.editor.setCursor(lineNum, 0);
                that.editor.focus();
            }
            layer.close(index);
        });
    },

    // 改变字体大小
    changeFontSize: function(delta) {
        this.fontSize += delta;
        if (this.fontSize < 10) this.fontSize = 10;
        if (this.fontSize > 24) this.fontSize = 24;
        this.layerDom.find('.CodeMirror').css('fontSize', this.fontSize + 'px');
        this.editor.refresh();
    },

    // 切换主题
    toggleTheme: function() {
        this.isDark = !this.isDark;
        var container = this.layerDom.find('#editorContainer');
        if (this.isDark) {
            container.removeClass('light');
            this.editor.setOption('theme', 'monokai');
        } else {
            container.addClass('light');
            this.editor.setOption('theme', 'default');
        }
    },

    // 显示快捷键
    showShortcuts: function() {
        var html = '<div style="padding:15px;line-height:2;">';
        html += '<p><b>Ctrl+S</b> - 保存文件</p>';
        html += '<p><b>Ctrl+F</b> - 搜索</p>';
        html += '<p><b>Ctrl+H</b> - 替换</p>';
        html += '<p><b>Ctrl+G</b> - 跳转行</p>';
        html += '</div>';
        layer.open({type:1, title:'快捷键', area:['300px','200px'], content:html});
    },

    // 关闭编辑器
    closeEditor: function(e) {
        e && e.stopPropagation();
        // 检查是否有未保存的标签
        var unsaved = this.tabs.filter(function(t) { return t.modified; });
        if (unsaved.length > 0) {
            if (!confirm('有 ' + unsaved.length + ' 个文件未保存，确定关闭？')) return;
        }
        // 重置状态
        this.tabs = [];
        this.activeTabIndex = -1;
        layer.close(this.layerIndex);
    },

    // 关闭弹窗前的确认：有未保存的文件就提示保存
    // 返回 true=可以直接关；false=阻止 layer 直接关（由提示框里的按钮来决定怎么关）
    confirmClose: function() {
        var self = this;
        this.saveCurrentTabContent();   // 先把编辑器里最新内容同步到标签，避免漏判
        var unsaved = this.tabs.filter(function(t) { return t.modified; });
        if (unsaved.length === 0) {
            return true;
        }

        layer.open({
            type: 0,
            title: '提示',
            icon: 3,
            btnAlign: 'c',
            content: '有 ' + unsaved.length + ' 个文件还没保存，是否保存后再关闭？',
            btn: ['保存并关闭', '不保存关闭'],
            yes: function(idx) {
                layer.close(idx);
                self.saveAllThenClose();
            },
            btn2: function(idx) {
                layer.close(idx);
                self.forceCloseEditor();
            },
            cancel: function() {
                // 点右上角 X = 取消关闭，弹窗留着
                return false;
            }
        });

        return false;
    },

    // 保存所有未保存的文件，全部成功后再关闭弹窗
    saveAllThenClose: function() {
        var self = this;
        var pending = this.tabs.filter(function(t) { return t.modified; });
        if (!pending.length) { this.forceCloseEditor(); return; }

        var left = pending.length, failed = false;
        var loadingIdx = layer.load(1, {shade: [0.3, '#000']});

        pending.forEach(function(tab) {
            $.ajax({
                url: '{:url("admin/tplmanage/api")}?do=save',
                type: 'POST',
                data: { filename: tab.filename, activepath: tab.path, content: tab.content },
                dataType: 'json',
                success: function(res) {
                    if (res.code == 1) { tab.modified = false; } else { failed = true; }
                },
                error: function() { failed = true; },
                complete: function() {
                    if (--left > 0) return;
                    layer.close(loadingIdx);
                    if (failed) {
                        self.renderTabs();
                        layer.msg('有文件保存失败，已取消关闭', {icon: 2});
                        return;
                    }
                    layer.msg('已保存', {icon: 1, time: 800});
                    self.forceCloseEditor();
                }
            });
        });
    },

    // 关掉查找/替换弹窗（如果开着）
    closeFindDialog: function() {
        if (this.findLayerIndex !== null) {
            layer.close(this.findLayerIndex);
            this.findLayerIndex = null;
        }
    },

    // 真正关闭编辑器弹窗（不再询问）
    forceCloseEditor: function() {
        // 顺带把查找/替换弹窗也关掉，避免留下孤儿弹窗
        this.closeFindDialog();
        this.tabs = [];
        this.activeTabIndex = -1;
        this.currentFile = '';
        layer.close(this.layerIndex);
    }
};

// 快捷键兜底：焦点不在代码窗口里时（比如刚点过左侧文件树、顶部工具栏按钮），
// 直接按 Ctrl+S / Ctrl+F / Ctrl+H / Ctrl+G 也要能触发对应操作。
// 焦点在代码窗口里时由 CodeMirror 的 extraKeys 处理，这里必须让开：
// CodeMirror 处理完只 preventDefault、不 stopPropagation，两边都响应就会重复触发一次。
$(document).on('keydown', function (e) {
    var ed = EditorApp.editor;
    // 编辑器弹窗还开着吗？弹窗关掉后 CodeMirror 的 DOM 会被 layer 一起移除
    if (!ed || !document.body.contains(ed.getWrapperElement())) return;
    if (ed.hasFocus()) return;                                   // 焦点在代码窗口里，交给 CodeMirror
    if (!(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey) return;

    var act = {83: 'save', 70: 'find', 72: 'replace', 71: 'gotoLine'}[e.keyCode || e.which];
    if (!act) return;

    e.preventDefault();   // 挡掉浏览器自己的 Ctrl+S 存网页 / Ctrl+F 查找 / Ctrl+H 历史 / Ctrl+G

    // 查找/替换弹窗已经开着时，只把焦点挪回输入框，不再叠一个新弹窗
    if ((act === 'find' || act === 'replace') && EditorApp.findLayerIndex !== null) {
        $('.miu-fr-layer').find('#frFind').focus();
        return;
    }
    EditorApp[act]();
});

// 打开编辑器弹窗
function openEditor(filename, path) {
    console.log('openEditor called:', filename, path);

    // 检查 editorPopup 元素是否存在
    var popup = $('#editorPopup');
    console.log('editorPopup found:', popup.length);

    if (popup.length === 0) {
        layer.msg('编辑器模板未找到', {icon: 2});
        return;
    }

    // 重置标签状态
    EditorApp.tabs = [];
    EditorApp.activeTabIndex = -1;

    EditorApp.layerIndex = layer.open({
        type: 1,
        title: '模板编辑器',
        closeBtn: 1,
        area: ['90%', '90%'],
        shadeClose: false,
        maxmin:true,
        content: popup.html(),
        // 点右上角 X 关弹窗时，若有未保存的文件就提示保存
        cancel: function() {
            return EditorApp.confirmClose();
        },
        // 编辑器弹窗无论从哪条路径关掉，都把查找/替换弹窗一并关掉
        end: function() {
            EditorApp.closeFindDialog();
        },
        success: function(layero) {
            console.log('Layer opened successfully');
            EditorApp.layerDom = layero;
            EditorApp.init(layero);
            // 文件树固定从模板根目录开始，方便浏览所有模板。
            EditorApp.basePath = '';
            EditorApp.loadFileTree();
            // 默认展开到当前文件所在目录，省得还要手动一层层点开
            EditorApp.expandToDir(path);
            EditorApp.loadFile(filename, path);
        }
    });
}
// 暴露到全局，供弹窗里的 onclick 调用
window.EditorApp = EditorApp;
window.openEditor = openEditor;
});
</script>
