{extend name="common/base"/}
<!-- 主体 -->
{block name="body"}

<div class="p-3">
	<form class="layui-form miucms-form-bar border-t border-x">
		<div class="layui-form-item">
			<div class="layui-inline">
				<label class="layui-form-label">条件筛选：</label>
				<div class="layui-input-inline" style="width:200px;">
					<select name="nav_id">
						<option value="">选择栏目</option>
						{volist name="navsSearch" id="v"}
						<option value="{$v.id}">{$v.title}</option>
						{/volist}
					</select>
				</div>
			</div>
			<div class="layui-inline">
				<div class="layui-input-inline" style="width:200px;">
					<input type="text" name="keywords" placeholder="请输入关键字" lay-affix="clear" class="layui-input" autocomplete="off" />
				</div>
			</div>
			<div class="layui-inline">
				<div class="layui-input-inline" style="width:100px;">
					<select name="flag">
						<option value="">选择属性</option>
						<option value="is_head">头条</option>
						<option value="is_recommend">推荐</option>
						<option value="is_special">特荐</option>
						<option value="is_jump">跳转</option>
					</select>
				</div>
			</div>
			<div class="layui-inline">
				<label class="layui-form-label">创建时间</label>
				<div class="layui-input-inline" style="width:300px;" id="search-date-box">
					<input type="text" name="add_time_start" class="layui-input" autocomplete="off" id="start-date" placeholder="起始时间" style="width:100px;display: inline;"> -
					<input type="text" name="add_time_end" class="layui-input" autocomplete="off" id="end-date" placeholder="截止时间" style="width:100px;display: inline;">
				</div>
			</div>
			<div class="layui-inline" style="width:150px">
				<div class="layui-input-inline" style="width:200px;">
						<button class="layui-btn layui-btn-normal layui-btn-sm" lay-submit="" lay-filter="table-search"><i class="layui-icon layui-icon-search mr-1"></i>搜索</button>
						<button type="button" class="layui-btn layui-btn-reset" id="btnTableReset">清空</button>
				</div>
			</div>
		</div>

	</form>
	<table class="layui-hide" id="article" lay-filter="article"></table>
</div>

<script type="text/html" id="recycleToolbar">
	<div class="layui-btn-container">
		<button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="restoreBtn">
			<i class="layui-icon layui-icon-refresh-3 layui-font-14"></i>批量恢复
		</button>
		<button class="layui-btn layui-btn-sm layui-btn-danger" lay-event="purgeBtn">
			<i class="layui-icon layui-icon-delete layui-font-14"></i>批量彻底删除
		</button>
		<button class="layui-btn layui-btn-sm layui-btn-danger table-btn-pull-right" lay-event="clearBtn">
			<i class="layui-icon layui-icon-fire layui-font-14"></i>清空回收站
		</button>
	</div>
</script>
<script type="text/html" id="tableRigthBar">
<div class="layui-btn-group">
	<a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="restore">恢复</a>
	<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="purge">彻底删除</a>
</div>
</script>
<script type="text/html" id="add_time">
	{{= formatTime(d.add_time)}}
</script>
<script type="text/html" id="delete_time">
	{{= d.delete_time > 0 ? formatTime(d.delete_time) : '-' }}
</script>
<script type="text/html" id="title">
	{{# if(d.litpic && d.litpic != ''){ }}
	<i class="layui-icon layui-icon-picture preview-thumb-icon" style="color:#1E9FFF;cursor:pointer;margin-right:4px;" data-src="{{= d.litpic}}"></i>
	{{# } }}
	{{# if(d.is_b ==1){ }}<b style="color:{{= d.title_color}}">{{d.title}}</b>{{# }else{ }}<b style="font-weight:normal;color:{{= d.title_color}}">{{d.title}}</b>{{# } }}
</script>
<script type="text/html" id="is_head">
	{{# if(d.is_head ==1){ }}
	<i class="layui-icon layui-icon-ok"></i>
	{{# }else{ }}
	<i class="layui-icon layui-icon-close"></i>
	{{# } }}
</script>
<script type="text/html" id="is_recommend">
	{{# if(d.is_recommend ==1){ }}
	<i class="layui-icon layui-icon-ok"></i>
	{{# }else{ }}
	<i class="layui-icon layui-icon-close"></i>
	{{# } }}
</script>
<script type="text/html" id="is_special">
	{{# if(d.is_special ==1){ }}
	<i class="layui-icon layui-icon-ok"></i>
	{{# }else{ }}
	<i class="layui-icon layui-icon-close"></i>
	{{# } }}
</script>

{/block}
<!-- /主体 -->

<!-- 脚本 -->
{block name="script"}
<script>
	layui.use(['tool','table','laydate'],function(){
		var table = layui.table, tool = layui.tool, form = layui.form, laydate = layui.laydate;
		// 读取上次选择的每页条数，没有则默认 20
		var savedLimit = parseInt(localStorage.getItem('doc_table_limit'), 10) || 20;

		layui.pageTable = table.render({
			id:'doc_table',
			elem: '#article',
			title: '文档回收站',
			toolbar: '#recycleToolbar',
			url: "{:url('admin/document/recycle')}",
			page: true,
			limit: savedLimit,
			height: 'full-83',
			cellMinWidth: 50,
			cols:[
					[
						{type: 'checkbox', fixed: 'left', align: 'center', rowspan: 2},
						{field:'id',title:'ID',align:'center',width:80,sort: true, rowspan: 2},
						{field:'title',title:'标题',toolbar:'#title', rowspan: 2},
						{field:'nav_name',title:'所属栏目',align:'center',width:120, rowspan: 2},
						{field:'click',title:'点击数',align:'center',width:90,sort: true, rowspan: 2},
						{field:'attr',title:'文章属性',align:'center',width:160,colspan: 3},
						{field:'add_time',title:'创建时间',align:'center',width:160,toolbar:'#add_time',sort: true, rowspan: 2},
						{field:'delete_time',title:'删除时间',align:'center',width:160,toolbar:'#delete_time', rowspan: 2},
						{fixed:'right',width:150,title:'操作',toolbar:'#tableRigthBar',ignoreExport:true,align:'center', rowspan: 2}
					],
					[
						{field:'is_head',title:'头条',align:'center',width:70,toolbar:'#is_head'},
						{field:'is_recommend',title:'推荐',align:'center',width:70,toolbar:'#is_recommend'},
						{field:'is_special',title:'特荐',align:'center',width:70,toolbar:'#is_special'},
					]
				],
			done: function(res, curr, count) {
				// 每次加载完成，把当前实际条数写回 localStorage
				localStorage.setItem('doc_table_limit', layui.pageTable.config.page.limit);

				// 缩略图图标悬停预览（事件委托，翻页后无需重新绑定）
				$(document).off('mouseenter.previewThumb').on('mouseenter.previewThumb', '.preview-thumb-icon', function(){
					var src = $(this).data('src');
					if(!src) return;
					layer.tips('<img src="'+ src +'" style="max-width:200px;max-height:200px;display:block;">', this, {
						tips: [1, '#fff'],
						time: 0,
						area: ['auto', 'auto'],
						skin: 'preview-thumb-tips'
					});
				}).off('mouseleave.previewThumb').on('mouseleave.previewThumb', '.preview-thumb-icon', function(){
					layer.closeAll('tips');
				});

				// 缩略图图标点击预览（layer.photos）
				$(document).off('click.previewThumb').on('click.previewThumb', '.preview-thumb-icon', function(e){
					e.stopPropagation();
					var src = $(this).data('src');
					if(!src) return;
					parent.layer.photos({
						photos: {
							"title": "缩略图预览",
							"start": 0,
							"data": [
								{
									"alt": "缩略图",
									"pid": 1,
									"src": src
								}
							]
						},
						footer: false
					});
				});
			}
		});

		//监听表格行工具事件：恢复
		table.on('tool(article)', function(obj) {
			if (obj.event === 'restore') {
				layer.confirm('确定要把该文档恢复到正常列表吗？', {
					icon: 3,
					title: '提示',
					focus:true,
				}, function (index) {
					tool.post("{:url('admin/document/restore')}", { id: obj.data.id }, function(e) {
						layer.msg(e.msg, {icon: e.code == 0 ? 1 : 2});
						if (e.code == 0) {
							obj.del();
							parent.layui.pageTable.reload();
						}
					});
					layer.close(index);
				});
			}
			if (obj.event === 'purge') {
				layer.confirm('彻底删除后无法恢复，确定要删除该文档吗？', {
					icon: 3,
					title: '警告',
					btn: ['确定彻底删除', '取消']
				}, function (index) {
					tool.post("{:url('admin/document/purge')}", { id: obj.data.id }, function(e) {
						layer.msg(e.msg, {icon: e.code == 0 ? 1 : 2});
						if (e.code == 0) {
							obj.del();
						}
					});
					layer.close(index);
				});
			}
			return false;
		});

		//监听表头工具栏事件：批量恢复
		table.on('toolbar(article)', function(obj){
			if (obj.event === 'restoreBtn') {
				var checkData = table.checkStatus(obj.config.id).data;
				if (checkData.length === 0) {
					return layer.msg('请先选择要恢复的文档');
				}
				var ids = checkData.map(function(item){ return item.id; });
				layer.confirm('确定要把选中的 ' + ids.length + ' 个文档恢复到正常列表吗？', {
					icon: 3,
					title: '提示',
					focus:true,
				}, function(index){
					tool.post("{:url('admin/document/restore')}", { id: ids }, function(e){
						layer.msg(e.msg, {icon: e.code == 0 ? 1 : 2});
						if (e.code == 0) {
							layui.pageTable.reloadData('doc_table');
							//同步刷新父页面的文档列表
							if (parent.layui && parent.layui.pageTable) {
								parent.layui.pageTable.reload();
							}
						}
					});
					layer.close(index);
				});
			}
			if (obj.event === 'purgeBtn') {
				var checkData = table.checkStatus(obj.config.id).data;
				if (checkData.length === 0) {
					return layer.msg('请先选择要彻底删除的文档');
				}
				var ids = checkData.map(function(item){ return item.id; });
				layer.confirm('彻底删除后无法恢复，确定要删除选中的 ' + ids.length + ' 个文档吗？', {
					icon: 3,
					title: '警告',
					btn: ['确定彻底删除', '取消']
				}, function(index){
					tool.post("{:url('admin/document/purge')}", { id: ids }, function(e){
						layer.msg(e.msg, {icon: e.code == 0 ? 1 : 2});
						if (e.code == 0) {
							layui.pageTable.reloadData('doc_table');
						}
					});
					layer.close(index);
				});
			}
			if (obj.event === 'clearBtn') {
				// 第一层警告
				layer.confirm('确定要清空回收站吗？<br><span style="color:#FF5722;font-weight:700;">回收站里的全部文档都会被彻底删除，此操作不可恢复！</span>', {
					icon: 3,
					title: '警告',
					btn: ['我已知晓，继续', '取消']
				}, function(index){
					layer.close(index);
					// 第二层警告：再确认一次，防止误点
					layer.confirm('最后确认：真的要清空整个回收站吗？<br><span style="color:#FF5722;font-weight:700;">删除后数据无法找回，请确认已经做好数据库备份！</span>', {
						icon: 3,
						title: '危险操作',
						btn: ['确认清空回收站', '我再想想']
					}, function(index2){
						layer.close(index2);
						layer.load(2);
						tool.post("{:url('admin/document/clear')}", {}, function(e){
							layer.closeAll('loading');
							layer.msg(e.msg, {icon: e.code == 0 ? 1 : 2});
							if (e.code == 0) {
								layui.pageTable.reloadData('doc_table');
								//同步刷新父页面的文档列表
								if (parent.layui && parent.layui.pageTable) {
									parent.layui.pageTable.reload();
								}
							}
						});
					});
				});
			}
			return false;
		});

		// 监听排序事件
		table.on('sort(article)', function(obj){
			layui.pageTable.reload({
				where: $.extend({}, layui.pageTable.config.where || {}, {
					field: obj.field,   // 排序字段，如 'click'、'sort'、'add_time'
					order: obj.type       // 'asc' 或 'desc'
				}),
				page: {curr: 1}          // 排序后回到第1页
			});
		});
		// 搜索框日期时间
		laydate.render({
			elem: '#search-date-box',
			range: ['#start-date', '#end-date'],
			rangeLinked: true
		});

		//监听搜索提交（与表单 lay-filter="table-search" 对应）
		form.on('submit(table-search)', function(data) {
			layui.pageTable.reload({
				where: data.field,
				page: {curr: 1}
			});
			return false;
		});
		// 监听清空按钮
		$('#btnTableReset').on('click', function() {
			$('select[name="nav_id"]').val('');
			$('select[name="flag"]').val('');
			$('input[name="keywords"]').val('');
			$('input[name="add_time_start"]').val('');
			$('input[name="add_time_end"]').val('');
			form.render('select');
			layui.pageTable.reload({
				where: {},
				page: {curr: 1}
			});
		});

	})
</script>
{/block}
<!-- /脚本 -->
