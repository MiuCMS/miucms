{extend name="common/base" /}
<!-- 主体 -->
{block name="body"}
<div class="p-page">
	<form class="layui-form miucms-form-bar border-t border-x">
		<div class="layui-input-inline" style="width:300px;">
			<input type="text" name="keywords" placeholder="昵称/操作数据id/操作描述" class="layui-input" autocomplete="off" />
		</div>
		<div class="layui-input-inline">
			<select name="action">
				<option value="">请选择类型</option>
				{volist name="$type_action" id="vo"}
				<option value="{$vo}">{$vo}</option>
				{/volist}
			</select>
		</div>
		<div class="layui-input-inline" style="width:150px">
			<button class="layui-btn layui-btn-normal layui-btn-sm" lay-submit="" lay-filter="table-search"><i class="layui-icon layui-icon-search mr-1"></i>搜索</button>
			<button type="reset" class="layui-btn layui-btn-reset" lay-filter="table-reset">清空</button>
		</div>
	</form>
	<table class="layui-hide" id="log" lay-filter="log"></table>
</div>
<script type="text/html" id="toolbarDemo">
	<div class="layui-btn-container">
		<h3>操作日志</h3>
	</div>
</script>
{/block}
<!-- /主体 -->

<!-- 脚本 -->
{block name="script"}
<script>
	layui.use(['tool','tablePlus'],function(){
		var table = layui.tablePlus, form = layui.form;
		layui.pageTable = table.render({
			elem: '#log',
			title: '操作日志列表',
			toolbar: '#toolbarDemo',
			url: "{:url('admin/log/index')}", //数据接口	
			page: true, //开启分页
			limit: 20,
			height: 'full-85',
			cols: [
				[ //表头
					{
						field: 'id',
						title: 'ID号',
						align: 'center',
						width: 90
					}, {
						field: 'action',
						title: '操作',
						align: 'center',
						width: 80
					}, {
						field: 'content',
						title: '操作描述'
					}, {
						field: 'param_id',
						title: '操作数据ID',
						align: 'center',
						width: 100
					},{
						field: 'nickname',
						title: '操作用户',
						align: 'center',
						width: 100
					}, {
						field: 'ip',
						title: 'IP地址',
						align: 'center',
						width: 130
					}, {
						field: 'create_time',
						title: '操作时间',
						fixed: 'right',
						align: 'center',
						width: 160
					}
				]
			]
		});

		//监听搜索提交
		form.on('submit(webform)', function (data) {
			tableIns.reload({
				where: data.field,
				page: {curr: 1}
			});
			return false;
		});
	})
</script>
{/block}
<!-- /脚本 -->
