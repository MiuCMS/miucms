<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>米柚CMS安装</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<link rel="stylesheet" href="{__ADMIN__}/layui/css/layui.css" media="all">
	<style>
		body {
			width: 100%;
			height: 100%;
			background-size: cover;
			background: url("{__ADMIN__}/images/bg_pattern.png"), #7b4397;
			background: url("{__ADMIN__}/images/bg_pattern.png"), -webkit-linear-gradient(to left, #34a853, #4285f4);
			background: url("{__ADMIN__}/images/bg_pattern.png"), linear-gradient(to left, #34a853, #4285f4);
		}
	</style>
</head>

<body>
	<div style="width:200px;margin: 20px auto;"><img src="{__ADMIN__}/images/login_logo.png" alt="米柚CMS安装" width="200"></div>
	<div style="width:888px;margin:0 auto 30px;">
		<div class="layui-layout layui-layout-admin">
			<div class="layui-header layui-bg-green" style="border-radius:6px 6px 0 0;position:relative;">
				<div class="layui-logo" style="color: #fff; width:100px;">安装引导</div>
				<ul class="layui-nav layui-layout-right">
					<li class="layui-nav-item">版本：v{:CMS_VERSION}</li>
				</ul>
			</div>
			<div style="padding:20px; background-color:#fff;line-height: 27px; border-radius:0 0 6px 6px">
				<form class="layui-form" action="" id="form" autocomplete="off">
					<h3>数据库配置</h3><br>
					<div class="layui-form-item">
						<label class="layui-form-label">数据库类型</label>
						<div class="layui-input-inline">
							<select id="DB_TYPE_DISPLAY">
								<option value="mysql" selected>MySQL</option>
								<option value="mariadb">MariaDB</option>
							</select>
							<input type="hidden" name="DB_TYPE" value="mysql">
						</div>
						<div class="layui-form-mid layui-word-aux">选择服务器数据库环境，一般是MySQL</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">数据库地址</label>
						<div class="layui-input-inline">
							<input type="text" name="DB_HOST" required lay-verify="required" class="layui-input" value="127.0.0.1" lay-reqText="请输入数据库地址">
						</div>
						<div class="layui-form-mid layui-word-aux">数据库服务器地址，一般为127.0.0.1</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">数据库端口</label>
						<div class="layui-input-inline">
							<input type="text" name="DB_PORT" required lay-verify="required" class="layui-input" value="3306" lay-reqText="请输入数据库端口">
						</div>
						<div class="layui-form-mid layui-word-aux">数据库端口，一般为3306</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">数据库名</label>
						<div class="layui-input-inline">
							<input type="text" name="DB_NAME" required lay-verify="required" class="layui-input" value="miucms" lay-reqText="请输入数据库名">
						</div>
						<div class="layui-form-mid layui-word-aux">系统数据库名,必须包含字母,不能有"-"等特殊符号，最好是小写字母</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">用户名</label>
						<div class="layui-input-inline">
							<input type="text" name="DB_USER" required lay-verify="required" class="layui-input" value="root" autocomplete="off" lay-reqText="请输入数据库用户名">
						</div>
						<div class="layui-form-mid layui-word-aux">连接数据库的用户名</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">密码</label>
						<div class="layui-input-inline">
							<input type="password" name="DB_PWD" required lay-verify="required" class="layui-input" autocomplete="new-password" lay-reqText="请输入数据库连接密码">
						</div>
						<div class="layui-form-mid layui-word-aux">连接数据库的密码</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">数据表前缀</label>
						<div class="layui-input-inline">
							<input type="text" name="DB_PREFIX" required lay-verify="required" class="layui-input" value="miu_" lay-reqText="请输入数据库表前缀">
						</div>
						<div class="layui-form-mid layui-word-aux">建议使用默认，同一个数据库安装多个系统时需更改，否则会覆盖</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label"></label>
						<div class="layui-input-inline">
							<button type="button" class="layui-btn layui-btn-primary layui-btn-sm layui-border" lay-filter="testsql">测试连接</button>
						</div>
						<div class="layui-form-mid layui-word-aux"></div>
					</div>

					<hr>
					<div class="layui-form-item">
						<label class="layui-form-label"><h3>演示数据</h3></label>
						<div class="layui-input-block">
							<input type="checkbox" name="import_demo" value="1" title="导入演示数据">
						</div>
					</div>
					<h3>超级管理员信息</h3><br>
					<div class="layui-form-item">
						<label class="layui-form-label">管理员账号</label>
						<div class="layui-input-inline" style="width:200px">
							<input type="text" name="username" lay-verify="required" class="layui-input" autocomplete="off" lay-reqText="请输入管理员账户">
						</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">登录密码</label>
						<div class="layui-input-inline" style="width:200px">
							<input type="password" name="password" lay-verify="required" class="layui-input" autocomplete="new-password" lay-reqText="请输入管理员账户密码">
						</div>
					</div>
					<div class="layui-form-item">
						<label class="layui-form-label">确认密码</label>
						<div class="layui-input-inline" style="width:200px">
							<input type="password" name="password_confirm" lay-verify="required" class="layui-input" autocomplete="new-password" lay-reqText="请重复输入管理员账户密码">
						</div>
					</div>
					<br>

					<div class="layui-progress layui-progress-big" lay-showpercent="true" lay-filter="demo" style="display: none;" id="progress">
						<div class="layui-progress-bar layui-bg-blue" lay-percent="0%"></div>
					</div>

					<div class="layui-form-item">
						<div style="margin:10px auto;width: 190px;">
							<a href="{$baseFile}?s=install/index/step2" class="layui-btn layui-bg-cyan">上一步</a>
							<button class="layui-btn layui-bg-blue" lay-submit="" lay-filter="install">安装系统</button>
						</div>
					</div>
				</form>
				<div style="display: none; padding: 20px 0; text-align: center;" id="complete">
					<h1>恭喜，安装完成!</h1><br><br><br>
					<div style="color:red; font-size:16px;">安装向导使用动态入口地址，不依赖伪静态规则。<a href="https://docs.miucms.com/" target="_blank" class="layui-btn layui-btn-xs layui-bg-blue">更多问题</a></div>
					<br><br><br>
					<div class="install_ajax">
						<a href="{$baseFile}?s=home/index/index" target="_blank" class="layui-btn layui-bg-cyan">访问首页</a>
						<a href="{$baseFile}?s=admin/index/index" target="_blank" class="layui-btn layui-bg-green">访问后台</a>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="{__ADMIN__}/layui/layui.js" charset="utf-8"></script>
	<script>
		layui.use(['element', 'jquery', 'layer', 'form'], function () {
			var $ = layui.jquery,
				layer = layui.layer,
				form = layui.form,
				element = layui.element;
			var n = 0;
			function install_ajax(){
				$.ajax({  
					url:"{:config('official.website')}/index.php?s=home/install_info/install_ajax",
					dataType:'jsonp',  
					data:{'name':'米柚CMS'},  
					jsonp:'callback',
					success:function(result) {  
						console.log(result);
					}
				});
			}
			
			$('body').on('click','.install_ajax',function(){
				install_ajax();
			})

			// 只测试数据库服务连接，不创建数据库或数据表。
			$('body').on('click', '[lay-filter="testsql"]', function () {
				var $button = $(this);
				var loading = layer.load(1, {shade: 0.08});
				$button.prop('disabled', true);

				$.ajax({
					url: "{$baseFile}?s=install/index/testConnection",
					type: "post",
					dataType: "json",
					data: {
						DB_HOST: $.trim($('[name="DB_HOST"]').val()),
						DB_PORT: $.trim($('[name="DB_PORT"]').val()),
						DB_NAME: $.trim($('[name="DB_NAME"]').val()),
						DB_USER: $.trim($('[name="DB_USER"]').val()),
						DB_PWD: $('[name="DB_PWD"]').val()
					},
					success: function (res) {
						if (res && Number(res.code) === 0) {
							layer.msg(res.msg || '数据库连接成功', {icon: 1, time: 3500});
						} else {
							var errorMessage = res && res.msg ? res.msg : '数据库连接失败';
							layer.alert($('<div>').text(errorMessage).html(), {icon: 2});
						}
					},
					error: function () {
						layer.alert('连接测试请求失败，请检查安装页面或服务器状态', {icon: 2});
					},
					complete: function () {
						layer.close(loading);
						$button.prop('disabled', false);
					}
				});
			});
			
			function submitInstall(installData) {
				$('#progress').css('display', 'block');
				n = 0;
				var timer = setInterval(function () {
					n = n + Math.random() * 10 | 0;
					if (n > 99) {
						n = 99;
						clearInterval(timer);
					}
					element.progress('demo', n + '%');
				}, 30 + Math.random() * 100);

				$.ajax({
					url: "{$baseFile}?s=install/index/install",
					type: "post",
					data: installData,
					beforeSend: function () {
						// 禁用按钮防止重复提交
						$('[lay-filter="install"]').prop('disabled', true).html('创建中...');
					},
					success: function (res) {
						if (Number(res.code) === 2) {
							clearInterval(timer);
							$('#progress').css('display', 'none');
							layer.confirm(res.msg || '检测到数据库中已有相同前缀的数据表，确认后将删除这些数据表及其中的数据并重新安装。此操作不可恢复，是否继续？', {
								icon: 3,
							title: '确认覆盖安装',
								btn: ['确定覆盖', '取消']
							}, function (index) {
								layer.close(index);
								installData.overwrite_existing = '1';
								submitInstall(installData);
							});
						} else if (Number(res.code) === 1) {
							clearInterval(timer);
							$('#progress').css('display', 'none');
							layer.msg(res.msg);
						} else {
							if (n == 99) {
								element.progress('demo', 100 + '%');
								$('#form').hide();
								$('#complete').show();
								return false;
							} else if (n < 99) {
								var ref = setInterval(function () {
									if (n == 99) {
										clearInterval(ref);
										element.progress('demo', 100 + '%');
										$('#form').hide();
										$('#complete').show();
									}
								}, 500)
							}
						}
					},
					complete: function () {
						$('[lay-filter="install"]').prop('disabled', false).html('安装系统');
					}
				})
			}

			//监听提交
			form.on('submit(install)', function (data) {
				submitInstall($.extend({}, data.field, {overwrite_existing: '0'}));
				return false;
			});
		});
	</script>

</body>

</html>
